name: Pabrik Materi Otomatis

on:
  schedule:
    # Otomatis jalan tiap hari jam 00:00 UTC (pagi hari waktu Indonesia)
    - cron: '0 0 * * *'
  workflow_dispatch: # Bisa diklik manual kapan saja lewat tab Actions

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install requests

      - name: Run AI Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate.py

      - name: Save Result to Repository
        run: |
          git config --global user.name "Guru AI Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add materi_*.md
          git commit -m "Otomatis tambah materi baru hari ini" || exit 0
          git push
